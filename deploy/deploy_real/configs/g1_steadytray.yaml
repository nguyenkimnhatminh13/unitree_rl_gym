# Optional live object pose topic for distillation policy.
# If unavailable (or stale), distill_object_obs is used automatically.
object_pose_topic: "/object_pose"
object_pose_msg_type: ""
object_pose_timeout_s: 0.5
# Match deploy_mujoco.get_object_pose convention:
# - final object_obs uses top-surface position + quaternion wxyz
# - if incoming topic pose is object center, set object_pose_is_top_surface: false
# - if topic quaternion is ROS style (x,y,z,w), keep object_pose_quat_order: "xyzw"
object_pose_quat_order: "xyzw"
object_pose_is_top_surface: false
object_half_height: 0.05
