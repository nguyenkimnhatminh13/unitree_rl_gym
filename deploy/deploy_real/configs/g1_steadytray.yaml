control_dt: 0.02

msg_type: "hg"
imu_type: "pelvis"

lowcmd_topic: "rt/lowcmd"
lowstate_topic: "rt/lowstate"

# Two checkpoints: "stable" (e.g. stage) vs main. From default pose: key_start_stable runs stable; A runs main.
# While running: press A once to switch stable -> main; press key_start_stable once to switch main -> stable.
policy_path_stable: "/home/nhatminh/vm/vmo_steadytray/output/exported/stage2.pt"
policy_path: "/home/nhatminh/vm/vmo_steadytray/exported/policy_9999.onnx"
# Remote button name: B, X, Y, R1, L1, F1, ... (see keymap_index_from_name in deploy_real_steadytray.py)
